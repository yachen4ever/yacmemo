[project]
name = "yacmemo"
version = "0.3.9"
description = "Lean personal memory layer: markdown-first, MCP, hybrid retrieval, API-enforced consistency"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "lancedb>=0.38.0",
    "pyarrow>=25.0",
    "numpy>=1.26",
    "rapidfuzz>=3.0",
    "mcp>=1.0,<2",  # 2.x renames FastMCP → MCPServer; migration is a P2 evaluation item
    "httpx>=0.27",
]

[project.scripts]
yacmemo-mcp = "yacmemo.mcp_server:main"       # stdio, single user, same-box agents
yacmemo-server = "yacmemo.server:main"        # HTTP, multi-user, multi-machine agents
yacmemo-curator = "yacmemo.curator:main"      # periodic quality review -> proposal report

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yacmemo"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # allow long lines in tests
"legacy/*" = ["E501", "F", "E", "W", "UP", "B", "SIM", "I"]  # frozen archive, not linted

[tool.pytest.ini_options]
testpaths = ["tests"]
